<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: system-ui, sans-serif; width: 180px; padding: 12px; margin: 0; }
    h3 { margin: 0 0 10px; font-size: 14px; color: #ef3939; }
    .option { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; cursor: pointer; font-size: 13px; }
    input { cursor: pointer; margin: 0; }
  </style>
</head>
<body>
  <h3>Changelog Theme</h3>
  <label class="option">
    <input type="radio" name="theme" value="light"> Light
  </label>
  <label class="option">
    <input type="radio" name="theme" value="dark"> Dark
  </label>
  <script src="popup.js"></script>
</body>
</html>
